name: Daily paper trade

# Runs after NSE close (15:30 IST) on weekdays. The paper account is stored
# ENCRYPTED in paper.enc (key = repository secret PAPER_KEY), and nothing the
# account holds or trades is printed to the log or uploaded as an artifact, so
# the public repo never shows positions, trades or signals.
on:
  schedule:
    - cron: "47 10 * * 1-5"      # 16:17 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAPER_KEY: ${{ secrets.PAPER_KEY }}
    steps:
      - name: Require the encryption key
        run: |
          if [ -z "$PAPER_KEY" ]; then
            echo "::error::Add the repository secret PAPER_KEY (see README: 'Private paper account')."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Decrypt paper account
        run: |
          if [ -f paper.enc ]; then python main.py paper unlock > /dev/null; fi
          # first run ever (or migration from the old unencrypted paper/ files): open the account
          if [ ! -f paper/state.json ]; then python main.py paper init > /dev/null; fi

      # output is hidden on purpose: it lists executions and positions (and an error could name a held stock)
      - name: Process today's bars
        run: |
          if ! python main.py paper run > /dev/null 2> run.err; then
            echo "::error::Paper run failed ($(grep -oE '^[A-Za-z]+(Error|Exit|Exception)' run.err | tail -1)). Details are hidden to keep the account private; run the Jupyter cell to see the full error."
            exit 1
          fi

      - name: Encrypt and commit
        run: |
          python main.py paper lock > /dev/null
          git config user.name "paper-trader-bot"
          git config user.email "paper-trader-bot@users.noreply.github.com"
          git rm -r -q --cached --ignore-unmatch paper
          git add paper.enc nifty200.txt
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Update paper account (encrypted)"
          # main may have moved while we ran (e.g. a merged PR): rebase onto it and retry
          for i in 1 2 3; do
            if git push -q; then exit 0; fi
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
